name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          set -euo pipefail
          # macOS-generated package-lock often skips Linux Rollup natives (npm/cli#4828).
          rm -rf node_modules package-lock.json
          npm install
          ROLLUP_VERSION="$(node -p "require('rollup/package.json').version")"
          npm install "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}" --no-save --force
          node -e "require('@rollup/rollup-linux-x64-gnu'); console.log('rollup native ok')"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
